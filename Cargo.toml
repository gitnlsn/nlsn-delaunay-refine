[package]
authors = ["nelson kenzo tamashiro <nelsonkenzotamashiro@gmail.com>"]
categories = ["algorithms", "mathematics", "science", "simulation", "wasm"]
description = "Delaunay Triangulation and Refinement implementation through Bowyer Watson incremental insertion, conflict maps and ghost vertices."
documentation = "https://github.com/nelsonatgithub/nlsn-delaunay-refine"
edition = "2021"
homepage = "https://github.com/nelsonatgithub/nlsn-delaunay-refine"
include = ["src/**/*.rs", "Cargo.toml"]
keywords = ["triangulation", "delaunay", "Bowyer-Watson", "refinement", "incremental"]
license-file = "LICENSE"
name = "nlsn-delaunay"
readme = "README.md"
repository = "https://github.com/nelsonatgithub/nlsn-delaunay-refine"
version = "0.1.1"

[lib]
name = "nlsn_delaunay"
path = "src/lib.rs"

# The CLI is opt-in. It pulls in glium (native OpenGL), structopt, serde and
# friends, none of which build for wasm32 -- and the browser is the renderer
# now, so the default build must not depend on them.
[[bin]]
name = "nlsn-delaunay"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = []
cli = [
  "dep:glium",
  "dep:structopt",
  "dep:structopt-derive",
  "dep:serde",
  "dep:serde_json",
  "dep:uuid",
  "dep:chrono",
]

# --- library dependencies: must stay wasm-clean ---
[dependencies]
float-cmp = "0.10"
num = { version = "0.4", default-features = false, features = ["std"] }
robust = "1.2"

# --- CLI-only dependencies, all optional ---
chrono = { version = "0.4", optional = true }
glium = { version = "0.27", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
structopt = { version = "0.3", optional = true }
structopt-derive = { version = "0.4", optional = true }
uuid = { version = "1", features = ["serde", "v4"], optional = true }
